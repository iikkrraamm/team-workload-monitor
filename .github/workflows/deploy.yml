name: Deploy

on:
  push:
    branches: [main]

# Needed so the "commit built frontend" step can push back to the repo.
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Default GITHUB_TOKEN can push to the same repo on non-fork
          # pushes, which is all this workflow needs.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Commit updated frontend/dist (if changed)
        id: commit_dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/dist
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            # [skip ci] stops this push from re-triggering this workflow.
            git commit -m "chore(deploy): rebuild frontend [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger server deploy (git pull + reload)
        run: |
          curl -sf -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "X-DEPLOY-TOKEN: ${{ secrets.DEPLOY_TOKEN }}"
